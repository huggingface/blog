 <text x="638" y="673" font-size="29" font-weight="700">Broader coverage</text>
 <text x="638" y="710" font-size="21">Across supported accelerator backends</text>
 <rect x="48" y="767" width="1104" height="51" rx="10" fill="#fff0c4"/>
 <text x="70" y="799" font-size="21" fill="#6e4b10">The gap: a regression can reach main before a scheduled run finds it.</text>
</g>
</svg>
